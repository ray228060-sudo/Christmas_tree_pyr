<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<main><h1>制作私人订制贺卡</h1><p>照片和密码只在你的设备上处理。下载加密贺卡后，把生成的 HTML 发给我，就能用现有的圣诞树制作新的分享链接。</p>
<form id="maker"><label>选照片<input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple required></label>
<label>设置新贺卡密码<input id="password" type="password" autocomplete="new-password" required></label>
<button type="submit">生成并下载加密贺卡</button><output id="status" aria-live="polite"></output><a id="download" hidden>再次下载加密贺卡</a></form></main>
<script>
const template = "\u003c!--\n  - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)\n  - @Author: wp/electronicminer\n  - @Date: 2025-12-08\n  - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.\n  - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')\n-->\n\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n    \u003ctitle>Grand Luxury Tree - Christmas Edition\u003c/title>\n    \n    \u003c!-- 引入 FontAwesome 图标库 (让图标更美观) -->\n    \n\n    \u003c!-- 引入不蒜子脚本 -->\n    \n\n    \u003cstyle>\n        /* 修改背景为深色渐变 */\n        body { \n            margin: 0; \n            overflow: hidden; \n            background: radial-gradient(circle at center, #0f2027 0%, #203a43 50%, #2c5364 100%); \n            background-color: #490c20; \n            font-family: 'Times New Roman', serif; \n            touch-action: none; \n            user-select: none;\n            -webkit-user-select: none;\n        }\n        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; cursor: grab; }\n        #canvas-container:active { cursor: grabbing; }\n\n        /* UI Overlay */\n        #ui-layer {\n            position: absolute; top: 0; left: 0; width: 100%; height: 100%;\n            z-index: 10; pointer-events: none;\n            display: flex; flex-direction: column; \n            align-items: center;\n            padding-top: 40px;\n            box-sizing: border-box;\n            transition: opacity 0.5s ease;\n        }\n        \n        .ui-hidden { opacity: 0 !important; pointer-events: none !important; }\n\n        /* Loading */\n        #loader {\n            position: absolute; top: 0; left: 0; width: 100%; height: 100%;\n            background: #490c20; z-index: 100;\n            display: flex; flex-direction: column; align-items: center; justify-content: center;\n            transition: opacity 0.8s ease-out;\n        }\n        .loader-text {\n            color: #d4af37; font-size: 14px; letter-spacing: 4px; margin-top: 20px;\n            text-transform: uppercase; font-weight: 100;\n        }\n        .spinner {\n            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.2); \n            border-top: 1px solid #d4af37; border-radius: 50%; \n            animation: spin 1s linear infinite;\n        }\n        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }\n\n        /* Typography */\n        h1 { \n            color: #fceea7; font-size: 8vw; \n            max-size: 56px; margin: 0; font-weight: 400; \n            letter-spacing: 6px; \n            text-shadow: 0 0 50px rgba(252, 238, 167, 0.6); \n            background: linear-gradient(to bottom, #fff, #eebb66);\n            -webkit-background-clip: text; -webkit-text-fill-color: transparent;\n            font-family: 'Cinzel', 'Times New Roman', serif;\n            opacity: 0.9; transition: opacity 0.5s ease;\n            text-align: center; pointer-events: none;\n        }\n        @media (min-width: 768px) { h1 { font-size: 56px; } }\n\n        /* Controls */\n        .controls-wrapper {\n            position: absolute; top: 100px; right: 20px;        \n            pointer-events: auto;\n            display: flex; flex-direction: column; align-items: flex-end;\n            gap: 10px; z-index: 20;\n            transition: opacity 0.5s ease;\n        }\n/* \u003c!--\n  - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)\n  - @Author: wp/electronicminer\n  - @Date: 2025-12-08\n  - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.\n  - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')\n--> */\n        .btn-group {\n            display: flex; flex-direction: column; gap: 10px; align-items: flex-end;\n        }\n\n        .control-btn {\n            background: rgba(20, 20, 20, 0.6); \n            border: 1px solid rgba(212, 175, 55, 0.4); \n            color: #d4af37; padding: 10px 20px; \n            cursor: pointer; text-transform: uppercase; \n            letter-spacing: 2px; font-size: 10px;\n            transition: all 0.4s;\n            display: flex; align-items: center; justify-content: center;\n            backdrop-filter: blur(5px); min-width: 120px;\n        }\n        \n        .control-btn.active {\n            background: rgba(212, 175, 55, 0.8); color: #000;\n            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);\n        }\n        .control-btn:hover { \n            background: #d4af37; color: #000; \n            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);\n        }\n        \n        .hint-text {\n            color: rgba(212, 175, 55, 0.5); font-size: 9px;\n            letter-spacing: 1px; text-transform: uppercase;\n            text-align: right; margin-top: 5px; max-width: 200px;\n        }\n\n        input[type=\"file\"] { display: none; }\n\n        /* Mode Buttons (Bottom) */\n        #mode-bar {\n            position: absolute; bottom: 30px; left: 50%;\n            transform: translateX(-50%);\n            display: flex; gap: 15px;\n            z-index: 20; pointer-events: auto;\n        }\n        .mode-btn {\n            width: 50px; height: 50px; border-radius: 50%;\n            background: rgba(0,0,0,0.6);\n            border: 1px solid #d4af37;\n            color: #d4af37; font-size: 20px;\n            display: flex; align-items: center; justify-content: center;\n            cursor: pointer; transition: all 0.3s;\n            backdrop-filter: blur(4px);\n        }\n        .mode-btn:active { transform: scale(0.9); background: #d4af37; color: #000; }\n        \n        /* Webcam feedback */\n        #webcam-wrapper {\n            position: absolute; bottom: 100px; left: 20px;         \n            width: 120px; height: 90px;\n            border: 1px solid rgba(212, 175, 55, 0.5); \n            box-shadow: 0 0 20px rgba(0,0,0,0.9);\n            border-radius: 4px; overflow: hidden; \n            opacity: 0; pointer-events: none;\n            z-index: 50; background: #000;\n            transition: opacity 0.5s ease; \n        }\n        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }\n\n        #debug-info {\n            position: absolute; bottom: 5px; left: 5px;\n            color: rgba(212, 175, 55, 0.6); font-size: 10px;\n            font-family: monospace; pointer-events: none; z-index: 51;\n            width: 100%; text-align: center;\n        }\n        \n        #msg-box {\n            position: absolute; top: 50%; left: 50%;\n            transform: translate(-50%, -50%);\n            background: rgba(0, 0, 0, 0.9);\n            border: 1px solid #d4af37;\n            padding: 20px; color: #d4af37;\n            z-index: 200; text-align: center;\n            display: none; border-radius: 8px; min-width: 200px;\n        }\n/* \u003c!--\n  - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)\n  - @Author: wp/electronicminer\n  - @Date: 2025-12-08\n  - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.\n  - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')\n--> */\n        /* -------------------------------------------\n           【全新升级】Luxury Stats Dashboard 样式\n           ------------------------------------------- */\n        #footer-stats {\n            position: absolute;\n            bottom: 25px;\n            right: 25px;\n            z-index: 40;\n            pointer-events: auto;\n            display: flex;\n            flex-direction: column;\n            gap: 12px;\n            /* 整体磨砂玻璃面板效果 */\n            background: rgba(8, 15, 25, 0.75);\n            backdrop-filter: blur(10px);\n            -webkit-backdrop-filter: blur(10px);\n            padding: 15px;\n            border-radius: 12px;\n            border: 1px solid rgba(212, 175, 55, 0.25);\n            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);\n            width: 200px; /* 固定宽度，确保整齐 */\n            transition: all 0.3s ease;\n            \n            /* 【修改】确保动画过渡自然 */\n            opacity: 1;\n            transform: translateY(0);\n        }\n\n        /* 专门优化地图容器 */\n        .map-container {\n            width: 100%;\n            height: 100px; /* 控制高度 */\n            overflow: hidden;\n            border-radius: 6px;\n            border: 1px solid rgba(255, 255, 255, 0.1);\n            position: relative;\n            background: #000; /* 地图加载前的背景 */\n        }\n\n        .map-container script, \n        .map-container iframe,\n        .map-container img {\n            filter: opacity(0.9) contrast(1.1); \n            transition: filter 0.3s;\n        }\n        .map-container:hover script,\n        .map-container:hover iframe {\n            filter: opacity(1) contrast(1);\n        }\n\n        .stats-title {\n            font-family: 'Cinzel', serif;\n            color: rgba(212, 175, 55, 0.9);\n            font-size: 10px;\n            letter-spacing: 2px;\n            text-align: center;\n            margin-bottom: 5px;\n            border-bottom: 1px solid rgba(212, 175, 55, 0.15);\n            padding-bottom: 5px;\n        }\n\n        .stats-row {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            font-size: 12px;\n            color: #ccc;\n        }\n\n        .stats-item {\n            display: flex;\n            align-items: center;\n            gap: 6px;\n        }\n\n        .stats-value {\n            font-family: 'Cinzel', serif; /* 使用高级衬线体 */\n            color: #fff;\n            font-weight: bold;\n            font-size: 14px;\n            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);\n        }\n    \u003c/style>\n    \n    \u003cstyle>\n        \n    \u003c/style>\n\n    \n\u003c/head>\n\u003cbody class=\"postcard-mode\">\u003cdialog id=\"photoUnlock\" style=\"max-width:85vw;background:#101b24;color:#fff1d1;border:1px solid #d3ad62;border-radius:12px;padding:22px\">\u003cform id=\"unlockForm\">\u003clabel for=\"photoPassword\">输入密码，打开圣诞照片\u003c/label>\u003cp>\u003cinput id=\"photoPassword\" type=\"password\" required autocomplete=\"off\" style=\"font-size:16px\">\u003c/p>\u003cbutton type=\"submit\">解锁照片\u003c/button>\u003cp id=\"unlockStatus\" role=\"status\">\u003c/p>\u003c/form>\u003c/dialog>\u003cstyle>#photoUnlock::backdrop{background:#0009}\u003c/style>\n\n    \u003cdiv id=\"loader\">\n        \u003cdiv class=\"spinner\">\u003c/div>\n        \u003cdiv class=\"loader-text\">Loading Memories\u003c/div>\n    \u003c/div>\n    \n    \u003cdiv id=\"msg-box\">\u003c/div>\n\n    \u003cdiv id=\"canvas-container\">\u003c/div>\n\n    \u003cdiv id=\"ui-layer\">\n        \u003ch1>Merry Christmas\u003c/h1>\n        \n        \u003cdiv class=\"controls-wrapper\">\n            \u003cdiv class=\"btn-group\">\n                \u003cdiv class=\"control-btn\" id=\"cam-btn\">📷 Enable Gesture\u003c/div>\n            \u003c/div>\n            \u003c!-- 【修改】添加了 Press 'S' for Stats 的提示 -->\n            \u003cdiv class=\"hint-text\">Touch: Drag | Click Photo | Press 'S' for Stats\u003c/div>\n        \u003c/div>\n\n        \u003c!-- 触屏模式切换按钮 -->\n\n        \u003c!-- 【美化版统计仪表盘】 -->\n        \u003c!-- 【修改】添加了 class=\"ui-hidden\" 默认隐藏 -->\n        \u003cdiv id=\"footer-stats\" class=\"ui-hidden\">\n            \u003cdiv class=\"stats-title\">WORLDWIDE VISITORS\u003c/div>\n            \n            \u003cdiv class=\"map-container\">\n                \n            \u003c/div>\n\u003c!--\n  - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)\n  - @Author: wp/electronicminer\n  - @Date: 2025-12-08\n  - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.\n  - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')\n--> \n            \u003cdiv class=\"stats-row\">\n                \u003cdiv class=\"stats-item\" title=\"Total Page Views\">\n                    \u003ci class=\"fas fa-eye\" style=\"color: #64ffda;\">\u003c/i>\n                    \u003cspan id=\"busuanzi_container_site_pv\" style=\"display:none\">\n                        \u003cspan id=\"busuanzi_value_site_pv\" class=\"stats-value\">...\u003c/span>\n                    \u003c/span>\n                \u003c/div>\n                \n                \u003cdiv class=\"stats-item\" title=\"Total Visitors\">\n                    \u003ci class=\"fas fa-user\" style=\"color: #d4af37;\">\u003c/i>\n                    \u003cspan id=\"busuanzi_container_site_uv\" style=\"display:none\">\n                        \u003cspan id=\"busuanzi_value_site_uv\" class=\"stats-value\">...\u003c/span>\n                    \u003c/span>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"webcam-wrapper\">\n        \u003cvideo id=\"webcam\" autoplay playsinline webkit-playsinline>\u003c/video>\n    \u003c/div>\n    \u003cdiv id=\"debug-info\">Drag to rotate • Tap photo to view\u003c/div>\n\n    \n\n\u003cstyle>\nbody.postcard-mode #loader,body.postcard-mode #ui-layer,body.postcard-mode #canvas-container,body.postcard-mode #stats-panel{display:none}\n#postcard{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 58%,#782a33,#3c0c1b 72%,#240913);color:#fff4de;text-align:center;display:grid;grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;overflow:hidden;padding:clamp(16px,4svh,36px) 12px max(14px,env(safe-area-inset-bottom));box-sizing:border-box}\n#postcard[hidden],#unlockedGallery[hidden]{display:none!important}\n#postcard h2{font:italic clamp(25px,5.2vw,43px) Georgia,serif;margin:0;text-shadow:0 2px 12px #421118}\n#postcard canvas{width:min(100%,570px);height:100%;min-height:0}\n#postcard p{margin:0 0 12px;font:italic clamp(18px,4vw,27px) Georgia,serif;color:#ffe0a2}\n#postcard button,#openAlbum button,#closeGallery{font:14px system-ui;color:#fff4de;background:#4d1c25;border:1px solid #d3aa71;border-radius:999px;padding:8px 13px;margin:0 3px;min-height:36px}\n#gestureStatus{display:block;font:13px system-ui;color:#ffe0a2;margin-top:6px}\n#photoUnlock{z-index:10000;margin:auto auto max(24px,env(safe-area-inset-bottom))} #photoUnlock::backdrop{background:#14040b50}\n#closeGallery{position:sticky;top:0;display:block;margin:0 0 10px auto}\n#morven3d{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:20px;color:#ffdf9c;font:italic 20px Georgia,serif;z-index:75;pointer-events:none}\n\u003c/style>\n\u003csection id=\"postcard\">\n \u003ch2>Merry Christmas\u003c/h2>\n \u003ccanvas id=\"evergreen\" role=\"img\" aria-label=\"挂着暖金灯、覆着白雪的层叠圣诞树\">\u003c/canvas>\n \u003cdiv>\u003csmall id=\"gestureStatus\" role=\"status\">\u003c/small>\u003c/div>\n\u003c/section>\n\u003cdiv id=\"morven3d\" hidden>From Morven\u003c/div>\n\u003cscript>\n(() => {\n const canvas=document.querySelector('#evergreen');\n const cx=canvas.getContext('2d');\n function draw(){\n  if(!cx||canvas.clientHeight\u003c1)return;\n  const w=canvas.clientWidth,h=canvas.clientHeight;\n  const d=Math.min(devicePixelRatio||1,1.5);\n  canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);\n  cx.setTransform(d,0,0,d,0,0);\n  let seed=12071;\n  const rand=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};\n  const x=w/2,unit=Math.min(w/400,h/470),base=h*.91;\n  cx.save();cx.translate(x,base);cx.scale(unit,unit);\n  const ellipse=(a,b,r,s,fill)=>{cx.fillStyle=fill;cx.beginPath();cx.ellipse(a,b,r,s,0,0,Math.PI*2);cx.fill()};\n  for(let i=0;i\u003c290;i++) ellipse((rand()-.5)*600,-rand()*480,rand()*1.65+.25,rand()*1.45+.25,'rgba(255,242,224,'+(.11+rand()*.53)+')');\n  const ground=cx.createRadialGradient(0,7,5,0,7,125);\n  ground.addColorStop(0,'#fff7e5');ground.addColorStop(1,'#fff7e500');\n  ellipse(0,7,128,20,ground);\n  cx.fillStyle='#3a241b';cx.fillRect(-7,-57,14,58);\n  const layers=8;\n  for(let layer=0;layer\u003clayers;layer++){\n   const y=-37-layer*41, radius=132-layer*14;\n   for(let branch=0;branch\u003c41;branch++){\n    const side=branch%2?1:-1;\n    const reach=(.26+rand()*.74)*radius;\n    const tipX=side*reach, tipY=y-12+rand()*22;\n    const stemY=y-48-rand()*15;\n    cx.strokeStyle=['#152d25','#264330','#426044'][branch%3];cx.lineWidth=3+rand()*2;\n    cx.beginPath();cx.moveTo(0,stemY);cx.quadraticCurveTo(tipX*.58,tipY+6,tipX,tipY);cx.stroke();\n    for(let n=1;n\u003c=18;n++){\n     const t=n/19, a=tipX*t,b=stemY+(tipY-stemY)*(1-(1-t)**2);\n     const spread=(3+rand()*9)*(1-t*.54);\n     cx.strokeStyle=['#153529','#254b34','#42714a','#829671'][n%4];cx.lineWidth=.8+rand();\n     cx.beginPath();cx.moveTo(a,b);cx.lineTo(a+side*spread,b-3-rand()*9);cx.moveTo(a,b);cx.lineTo(a+side*spread*.72,b+rand()*9);cx.stroke();\n    }\n    if(branch%3===0){\n     cx.strokeStyle=branch%2?'rgba(255,252,235,.76)':'rgba(200,220,204,.60)';cx.lineWidth=1.6+rand()*2;\n     cx.beginPath();cx.moveTo(tipX*.32,stemY*.49+tipY*.51-3);cx.quadraticCurveTo(tipX*.73,tipY+4,tipX,tipY-2);cx.stroke();\n    }\n   }\n   for(let bulb=0;bulb\u003c12;bulb++){\n    const a=(rand()-.5)*radius*1.65,b=y-18+rand()*23;\n    const glow=cx.createRadialGradient(a,b,0,a,b,9);glow.addColorStop(0,'#fff4c4');glow.addColorStop(.24,'#ffd978b0');glow.addColorStop(1,'#ffca4500');\n    ellipse(a,b,9,9,glow);ellipse(a,b,1.3,1.6,'#fff8ce');\n    if(bulb%5===0)ellipse(a+4,b-4,3.4,3.6,bulb%2?'#cb3443':'#ffcd69');\n   }\n  }\n  cx.beginPath();\n  for(let i=0;i\u003c10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:16;const px=Math.cos(a)*r,py=-380+Math.sin(a)*r;i?cx.lineTo(px,py):cx.moveTo(px,py)}\n  cx.closePath();cx.shadowBlur=16;cx.shadowColor='#face6a';cx.fillStyle='#ffe098';cx.fill();cx.restore();\n }\n draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(canvas);else window.addEventListener('resize',draw);\n window.addEventListener('tree-photo-unlocked',()=>{\n  const script=document.createElement('script');\n  const status=document.querySelector('#unlockStatus');\n  const dialog=document.querySelector('#photoUnlock');\n  script.type='module';\n  script.src='./private-tree-gesture.js';\n  const showFallback=()=>{\n   dialog.close();\n   document.querySelector('#gestureStatus').textContent='3D 暂未加载，可先查看照片。';\n   document.querySelector('#unlockedGallery').hidden=false;\n  };\n  const fallback=setTimeout(showFallback,12000);\n  script.addEventListener('error',()=>{clearTimeout(fallback);showFallback()},{once:true});\n  window.addEventListener('tree-3d-failed',()=>{clearTimeout(fallback);showFallback()},{once:true});\n  window.addEventListener('tree-3d-ready',()=>{\n   clearTimeout(fallback);\n   dialog.close();\n   document.body.classList.remove('postcard-mode');\n   document.querySelector('#postcard').hidden=true;document.querySelector('#morven3d').hidden=false;\n  },{once:true});\n  status.textContent='密码正确，正在挂上照片…';\n  document.body.append(script);\n },{once:true});\n})();\n\u003c/script>\u003csection id=\"unlockedGallery\" aria-label=\"已解锁的照片\" hidden>\u003cbutton id=\"closeGallery\" onclick=\"this.parentElement.hidden=true\">返回圣诞树\u003c/button>\u003c/section>\n\u003cstyle>#unlockedGallery{position:fixed;inset:6% 5%;z-index:9999;overflow:auto;text-align:center;background:#101b24;padding:12px;border:1px solid #d3ad62;border-radius:12px}#unlockedGallery img{display:block;max-width:100%;max-height:74vh;margin:0 auto 14px}\u003c/style>\n\u003cscript>async function photoKey(password,salt) {\n const material = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);\n return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);\n}\nfunction protectPhoto() {\n const packet = __NEW_PHOTO_PACKET__;\n const dialog = document.querySelector('#photoUnlock');\n const form = document.querySelector('#unlockForm');\n const field = document.querySelector('#photoPassword');\n const status = document.querySelector('#unlockStatus');\n const button = form.querySelector('button');\n const gallery = document.querySelector('#unlockedGallery');\n const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));\n dialog.addEventListener('cancel', event => event.preventDefault());\n form.addEventListener('submit', async event => {\n  event.preventDefault();\n  button.disabled = true;\n  status.textContent = '正在解锁…';\n  try {\n   const key = await photoKey(field.value,bytes(packet.salt));\n   const photos = await Promise.all(packet.photos.map(async photo => {\n    const encrypted = bytes(photo.data);\n    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(photo.iv)},key,encrypted);\n    return new Blob([plain],{type:photo.type});\n   }));\n   window.treePhotoUrls = photos.map(photo => URL.createObjectURL(photo));\n   window.treePhotoUrls.forEach((url,index) => {\n    const image = new Image();\n    image.src = url;\n    image.alt = '圣诞照片 '+(index+1);\n    gallery.append(image);\n   });\n   form.reset();\n   window.dispatchEvent(new Event('tree-photo-unlocked'));\n  } catch {\n   status.textContent = '解锁失败，请检查密码，或换一个支持 HTTPS 的浏览器。';\n  } finally {\n   if(!window.treePhotoUrls)button.disabled = false;\n  }\n });\n}\nprotectPhoto();\ndocument.querySelector('#photoUnlock').showModal();\n\u003c/script>\n\u003cstyle>\n#musicToggle {\n position: fixed; z-index: 81; top: max(12px, env(safe-area-inset-top));\n right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px;\n display: grid; place-items: center; padding: 0; border-radius: 50%;\n border: 1px solid #c6b75e; background: #182918; color: #fff0bf;\n font: 23px/1 system-ui; cursor: pointer;\n}\nbody:not(.postcard-mode) #musicToggle {\n top: auto;\n bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));\n}\n#musicToggle[aria-pressed=\"true\"] span { animation: music-spin 3s linear infinite; }\n@keyframes music-spin { to { transform: rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) {\n #musicToggle[aria-pressed=\"true\"] span { animation: none; }\n}\n\u003c/style>\n\u003caudio id=\"holidayMusic\" src=\"./holiday-music.mp3\" preload=\"metadata\" loop playsinline>\u003c/audio>\n\u003cbutton id=\"musicToggle\" type=\"button\" aria-label=\"播放音乐\" aria-pressed=\"false\">\u003cspan aria-hidden=\"true\">♫\u003c/span>\u003c/button>\n\u003cscript>\n(() => {\n const song = document.querySelector('#holidayMusic');\n const toggle = document.querySelector('#musicToggle');\n const unlockDialog = document.querySelector('#photoUnlock');\n unlockDialog.append(toggle);\n unlockDialog.addEventListener('close', () => document.body.append(toggle));\n const startTime = 38;\n const volume = 0.32;\n const fadeSeconds = 3;\n let context, gain, hasPlayed = false, manuallyPaused = false;\n\n song.currentTime = startTime;\n song.volume = volume;\n\n function prepareAudio() {\n  if (context) return;\n  const AudioEngine = window.AudioContext || window.webkitAudioContext;\n  if (!AudioEngine) return;\n  context = new AudioEngine();\n  gain = context.createGain();\n  gain.gain.value = 0;\n  context.createMediaElementSource(song).connect(gain).connect(context.destination);\n  song.volume = 1;\n }\n\n function playMusic() {\n  try {\n   prepareAudio();\n   if (context?.state === 'suspended') void context.resume().catch(() => {});\n  } catch (error) {\n   console.warn('Music fade unavailable', error);\n  }\n  void song.play().catch(() => {});\n }\n\n function setPlaying(playing) {\n  toggle.setAttribute('aria-pressed', String(playing));\n  toggle.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');\n }\n\n song.addEventListener('playing', () => {\n  if (song.seeking) return;\n  if (gain && !hasPlayed) {\n   const now = context.currentTime;\n   gain.gain.setValueAtTime(0, now);\n   gain.gain.linearRampToValueAtTime(volume, now + fadeSeconds);\n  }\n  hasPlayed = true;\n  setPlaying(true);\n });\n song.addEventListener('pause', () => setPlaying(false));\n song.addEventListener('waiting', () => setPlaying(false));\n song.addEventListener('error', () => setPlaying(false));\n\n toggle.addEventListener('click', () => {\n  manuallyPaused = !song.paused;\n  if (manuallyPaused) song.pause();\n  else playMusic();\n });\n\n document.querySelector('#unlockForm').addEventListener('submit', () => {\n  if (!hasPlayed && !manuallyPaused) playMusic();\n }, true);\n playMusic();\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>";
const form=document.querySelector('#maker');
const status=document.querySelector('#status');
const download=document.querySelector('#download');
const button=form.querySelector('button');
function b64(bytes){
 let result='';
 for(let i=0;i<bytes.length;i+=16384)result+=String.fromCharCode(...bytes.subarray(i,i+16384));
 return btoa(result);
}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const files=[...document.querySelector('#photos').files];
 const password=document.querySelector('#password');
 if(!files.length||!password.value)return;
 button.disabled=true;
 status.textContent='正在加密照片…';
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['encrypt']);
  const photos=[];
  for(const file of files){
   if(!/^image\/(jpeg|png|webp|gif|avif)$/.test(file.type))throw new Error('请选择 JPG、PNG、WebP、GIF 或 AVIF 照片。');
   const iv=crypto.getRandomValues(new Uint8Array(12));
   const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await file.arrayBuffer());
   photos.push({iv:b64(iv),type:file.type,data:b64(new Uint8Array(data))});
  }
  const packet=JSON.stringify({salt:b64(salt),photos});
  const html=template.replace('__NEW_PHOTO_PACKET__',()=>packet);
  if(download.href)URL.revokeObjectURL(download.href);
  download.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  download.download='morven-private-'+Date.now()+'.html';
  download.hidden=false;
  download.click();
  password.value='';
  status.textContent='已生成。请把下载的 HTML 发给我。';
 }catch(error){
  status.textContent=error.message||'生成失败，请重试。';
 }finally{button.disabled=false;}
});
</script></html>
